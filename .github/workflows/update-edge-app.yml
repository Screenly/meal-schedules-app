---
name: Update Edge App

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]*'

run-name: Updating Meal Schedules in ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'production' || 'stage' }}

jobs:
  deploy-stage:
    name: Updating Meal Schedules in stage
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    environment: stage
    steps:
      - uses: actions/checkout@v7
      - uses: Screenly/edge-apps-actions/update@v26.9.1
        with:
          screenly_api_token: ${{ secrets.SCREENLY_API_TOKEN }}
          environment: stage
          delete_missing_settings: 'true'
          edge_app_id: ${{ secrets.EDGE_APP_ID || vars.STAGE_EDGE_APP_ID }}

  deploy-production:
    name: Updating Meal Schedules in production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: Screenly/edge-apps-actions/update@v26.9.1
        with:
          screenly_api_token: ${{ secrets.SCREENLY_API_TOKEN }}
          environment: production
          delete_missing_settings: 'true'
          edge_app_id: ${{ secrets.EDGE_APP_ID || vars.PRODUCTION_EDGE_APP_ID }}
